# Render Blueprint: the app (one Docker web service) and its Postgres database. Steps are in DEPLOY.md.
# Values marked "sync: false" are secrets you type into Render's dashboard; they never live in this repo.
databases:
  - name: smoothbudget-db
    databaseName: smoothbudget
    user: smoothbudget
    postgresMajorVersion: "17"
    plan: basic-256mb

services:
  - type: web
    name: smoothbudget
    runtime: docker
    plan: starter # always on: background bank syncs and Plaid webhooks need it awake
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Default
        fromDatabase:
          name: smoothbudget-db
          property: connectionString
      - key: PLAID_ENV
        value: production
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_TOKEN_KEY
        sync: false
      - key: PLAID_WEBHOOK_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://smoothbudget.onrender.com
